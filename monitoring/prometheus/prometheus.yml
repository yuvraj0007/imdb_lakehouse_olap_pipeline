global:
  scrape_interval: 10s
  evaluation_interval: 10s
  scrape_timeout: 8s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  # ─── Self-monitoring ───────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          instance_name: "prometheus"

  # ─── ClickHouse OLAP Engine ────────────────────────────────────
  - job_name: "clickhouse"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["clickhouse:9363"]
        labels:
          instance_name: "clickhouse"

  # ─── Node Exporter (Host Metrics) ─────────────────────────────
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance_name: "node-exporter"

  # ─── Spark Master (HTTP probe - checks if alive) ──────────────
  # Note: Apache Spark doesn't expose /metrics by default.
  # For production, add JMX Exporter agent to spark-submit.
  # Here we use a simple scrape that will show 'up' status based on TCP connect.
  - job_name: "spark-master"
    metrics_path: "/metrics/"
    scheme: "http"
    static_configs:
      - targets: ["spark-master:8080"]
        labels:
          instance_name: "spark-master"
    # Allow scrape to succeed even if no metrics returned
    # This ensures 'up' metric works as a health indicator
    scrape_timeout: 3s
    honor_labels: true
