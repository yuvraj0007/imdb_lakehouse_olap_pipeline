name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ═══════════════════════════════════════════════════════════════
  # LINT - Code quality checks
  # ═══════════════════════════════════════════════════════════════
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: pip install flake8 black isort

      - name: Run flake8
        run: flake8 src/ tests/ --max-line-length=120 --extend-ignore=E203,W503

      - name: Run black (check)
        run: black --check --line-length=120 src/ tests/

      - name: Run isort (check)
        run: isort --check --profile=black src/ tests/

  # ═══════════════════════════════════════════════════════════════
  # UNIT TESTS - Fast isolated tests
  # ═══════════════════════════════════════════════════════════════
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-spark

      - name: Run unit tests with coverage
        run: pytest tests/test_etl_job.py -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════
  # INTEGRATION TESTS - Pipeline end-to-end (mocked services)
  # ═══════════════════════════════════════════════════════════════
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Run integration tests
        run: pytest tests/test_integration.py -v --timeout=120

  # ═══════════════════════════════════════════════════════════════
  # DOCKER BUILD - Validate container images
  # ═══════════════════════════════════════════════════════════════
  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Spark image
        run: docker build -f docker/spark.Dockerfile -t imdb-spark .

      - name: Build ClickHouse image
        run: docker build -f docker/clickhouse.Dockerfile -t imdb-clickhouse .

      - name: Validate docker compose config
        run: docker compose config --quiet

  # ═══════════════════════════════════════════════════════════════
  # E2E TEST - Full pipeline with real containers (main only)
  # ═══════════════════════════════════════════════════════════════
  e2e-test:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start services
        run: docker compose up -d --build

      - name: Wait for health checks
        run: |
          echo "Waiting for Spark Master..."
          timeout 60 bash -c 'until docker inspect --format="{{.State.Health.Status}}" spark-master 2>/dev/null | grep -q healthy; do sleep 2; done'
          echo "Spark Master is healthy"

          echo "Waiting for ClickHouse..."
          timeout 60 bash -c 'until docker inspect --format="{{.State.Health.Status}}" clickhouse 2>/dev/null | grep -q healthy; do sleep 2; done'
          echo "ClickHouse is healthy"

      - name: Create test data
        run: |
          mkdir -p data/raw

          # Create minimal title.basics.tsv (10 rows)
          cat > data/raw/title.basics.tsv << 'EOF'
          tconst	titleType	primaryTitle	originalTitle	isAdult	startYear	endYear	runtimeMinutes	genres
          tt0000001	short	Carmencita	Carmencita	0	1894	\N	1	Documentary,Short
          tt0000002	short	Le clown et ses chiens	Le clown et ses chiens	0	1892	\N	5	Animation,Short
          tt0000003	short	Pauvre Pierrot	Pauvre Pierrot	0	1892	\N	4	Animation,Comedy,Romance
          tt0000004	short	Un bon bock	Un bon bock	0	1892	\N	12	Animation,Short
          tt0000005	short	Blacksmithing Scene	Blacksmithing Scene	0	1893	\N	1	Comedy,Short
          tt0000006	short	Chinese Opium Den	Chinese Opium Den	0	1894	\N	1	Short
          tt0000007	short	Corbett and Courtney	Corbett and Courtney	0	1894	\N	1	Short,Sport
          tt0000008	short	Edison Kinetoscopic	Edison Kinetoscopic	0	1894	\N	1	Documentary,Short
          tt0000009	movie	Miss Jerry	Miss Jerry	0	1894	\N	45	Romance
          tt0000010	short	Leaving the Factory	Leaving the Factory	0	1895	\N	1	Documentary,Short
          EOF

          # Create minimal title.ratings.tsv (10 rows)
          cat > data/raw/title.ratings.tsv << 'EOF'
          tconst	averageRating	numVotes
          tt0000001	5.7	1976
          tt0000002	5.8	265
          tt0000003	6.5	1818
          tt0000004	5.5	178
          tt0000005	6.2	2620
          tt0000006	5.1	182
          tt0000007	5.2	788
          tt0000008	5.4	2108
          tt0000009	5.3	201
          tt0000010	6.9	7293
          EOF

          # Create minimal title.episode.tsv (10 rows)
          cat > data/raw/title.episode.tsv << 'EOF'
          tconst	parentTconst	seasonNumber	episodeNumber
          tt0000001	tt0000001	1	1
          tt0000002	tt0000001	1	2
          tt0000003	tt0000001	1	3
          tt0000004	tt0000002	1	1
          tt0000005	tt0000002	1	2
          tt0000006	tt0000002	2	1
          tt0000007	tt0000003	1	1
          tt0000008	tt0000003	1	2
          tt0000009	tt0000003	2	1
          tt0000010	tt0000003	2	2
          EOF

      - name: Run ETL job
        run: |
          docker compose exec -T spark-master spark-submit \
            --master local[*] \
            /opt/spark/src/etl/pipeline.py

      - name: Load data to ClickHouse
        run: |
          docker compose exec -T spark-master python \
            /opt/spark/src/olap/pipeline.py

      - name: Verify ClickHouse has data
        run: |
          # Query ClickHouse to verify data was loaded
          docker compose exec -T clickhouse clickhouse-client \
            --password clickhouse \
            --query "SELECT count(*) FROM imdb.titles" | tee /tmp/count.txt

          COUNT=$(cat /tmp/count.txt | tr -d '[:space:]')
          if [ "$COUNT" -gt "0" ]; then
            echo "✅ ClickHouse has $COUNT rows in titles table"
          else
            echo "❌ No data found in ClickHouse"
            exit 1
          fi

      - name: Tear down services
        if: always()
        run: docker compose down -v
